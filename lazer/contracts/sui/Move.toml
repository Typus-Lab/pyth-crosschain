[package]
name = "pyth_lazer"
version = "0.0.0"
edition = "2024"
published-at = "0x7b502c8a7bcb3915892347f11086745570e759fe9708d03c03accf4c90bbf580"

# Same Typus-Lab wormhole rev as the sibling target_chains Pyth dep so a
# consumer's dependency graph resolves a single wormhole package (mirrors the
# testnet branch, which pins Typus-Lab/wormhole rev = "testnet").
[dependencies.wormhole]
git = "https://github.com/Typus-Lab/wormhole.git"
subdir = "sui/wormhole"
rev = "sui/mainnet"
